name: Night Deck Original - Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publicar aplicativo
        shell: pwsh
        run: dotnet publish PokeIdleMulti/PokeIdleMulti.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: Night-Deck-Original-Portable
          path: publish/
      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Criar instalador
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: Night-Deck-Original-Installer
          path: installer-output/*.exe

      - name: Empacotar versão portátil
        if: github.event_name == 'push'
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath Night-Deck-Original-Portable.zip -Force
      - name: Publicar Release automaticamente
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-${{ github.run_number }}"
          gh release create $tag "Night-Deck-Original-Portable.zip" installer-output/*.exe --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Night Deck - Build ${{ github.run_number }}" --notes "Compilação automática da branch main. Commit: ${{ github.sha }}" --latest
